name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Build demo app
        run: npm run build

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngx-leaflet-map-dist
          path: dist/ngx-leaflet-map/

      - name: Upload demo app artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-app-dist
          path: dist/ngx-leaflet-map-workspace/

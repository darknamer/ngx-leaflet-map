name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Build demo app
        run: npm run build

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngx-leaflet-map-dist
          path: dist/ngx-leaflet-map/

      - name: Upload demo app artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-app-dist
          path: dist/ngx-leaflet-map-workspace/

      - name: Deploy to Firebase Hosting
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: darknamer-40b10
          channelId: live

      - name: Purge old artifacts (keep latest 10)
        uses: actions/github-script@v7
        with:
          script: |
            const MAX_KEEP = 10;
            const names = ['ngx-leaflet-map-dist', 'demo-app-dist'];
            for (const name of names) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                per_page: 100,
              });
              const sorted = data.artifacts.sort((a, b) =>
                new Date(b.created_at) - new Date(a.created_at)
              );
              for (const artifact of sorted.slice(MAX_KEEP)) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                core.info(`Deleted artifact ${artifact.name} (id=${artifact.id}, created=${artifact.created_at})`);
              }
            }
